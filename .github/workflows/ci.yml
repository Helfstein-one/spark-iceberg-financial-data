name: PySpark ETL CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    # We use a container that already has Java 17 to speed up Spark setup
    container:
      image: openjdk:17-slim

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y procps libc6 gcc default-jre
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v
        
    - name: Run Integration Tests
      run: |
        # Iceberg local file catalog is used here without needing MinIO to pass
        pytest tests/integration/ -v
        
    - name: Run Performance Tests
      run: |
        pytest tests/performance/ -v
        
    - name: Validate Iceberg Schema
      run: |
        pytest tests/integration/test_schema_validation.py -v

name: PySpark ETL CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre openjdk-17-jre-headless
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/unit/ -v
        
    - name: Run Integration Tests
      env:
        PYTHONPATH: .
        WAREHOUSE_PATH: "file:///tmp/warehouse"
      run: |
        # Iceberg local file catalog is used here without needing MinIO to pass
        pytest tests/integration/ -v
        
    - name: Run Performance Tests
      env:
        PYTHONPATH: .
        WAREHOUSE_PATH: "file:///tmp/warehouse"
      run: |
        pytest tests/performance/ -v
        
    - name: Validate Iceberg Schema
      env:
        PYTHONPATH: .
        WAREHOUSE_PATH: "file:///tmp/warehouse"
      run: |
        pytest tests/integration/test_schema_validation.py -v
